<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111111">
  <title>英検4級 語彙資料</title>
  <style>
    :root{
      --bg:#f6f6f2;
      --surface:#ffffff;
      --ink:#111111;
      --muted:#74746c;
      --line:#dcdcd5;
      --accent:#e52621;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Sans",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    main{
      width:min(720px,calc(100% - 36px));
      margin:0 auto;
      padding:64px 0 80px;
    }
    .eyebrow{
      margin:0 0 10px;
      color:var(--accent);
      font-size:11px;
      font-weight:800;
      letter-spacing:.16em;
    }
    h1{
      margin:0;
      font-size:clamp(40px,11vw,72px);
      line-height:.95;
      letter-spacing:-.055em;
    }
    .lead{
      margin:20px 0 0;
      color:var(--muted);
      line-height:1.8;
      font-size:15px;
    }
    .card{
      margin-top:34px;
      padding:22px;
      border:1px solid var(--line);
      border-radius:18px;
      background:var(--surface);
    }
    .label{
      font-size:11px;
      color:var(--muted);
      letter-spacing:.12em;
      font-weight:700;
    }
    .file-title{
      margin-top:12px;
      font-size:20px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .file-copy{
      margin-top:8px;
      color:var(--muted);
      font-size:13px;
      line-height:1.7;
    }
    .download{
      display:flex;
      width:100%;
      min-height:52px;
      margin-top:20px;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      background:var(--ink);
      color:white;
      text-decoration:none;
      font-weight:800;
    }
    footer{
      margin-top:28px;
      padding-top:18px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:11px;
      line-height:1.7;
    }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">EIKEN GRADE 4</p>
  <h1>Vocabulary<br>Material</h1>
  <p class="lead">
    授業で使用する英検4級の語彙資料です。<br>
    下のボタンからExcelファイルを保存してください。
  </p>

  <section class="card">
    <div class="label">DOWNLOAD</div>
    <div class="file-title">英検4級 単語・熟語一覧</div>
    <div class="file-copy">Excel形式の配布資料です。</div>
    <a class="download" href="./downloads/eiken4_vocabulary.xlsx" download>
      Excelファイルをダウンロード
    </a>
  </section>

  <footer>
    このページでは学習アプリ・確認テストは提供していません。
  </footer>
</main>

<script>
(async () => {
  // Remove any old PWA registrations and cached app assets from this origin.
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (_) {}
})();
</script>
</body>
</html>

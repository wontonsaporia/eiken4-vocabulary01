<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英検4級 Vocabulary Test</title>
<style>
:root{--bg:#f6f6f3;--panel:#fff;--text:#111;--muted:#74746d;--line:#deded8;--accent:#e52421;--ok:#1f7a45;--ng:#b32828}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button,input,select{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
header{padding:12px 0 24px}
.eyebrow{margin:0 0 7px;color:var(--accent);font-size:12px;letter-spacing:.16em;font-weight:800}
h1{margin:0;font-size:clamp(38px,10vw,68px);line-height:.95;letter-spacing:-.05em}
.sub{margin:14px 0 0;color:var(--muted);line-height:1.6}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 12px}
.btn{border:1px solid var(--line);background:#fff;color:#111;padding:11px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:#111;color:#fff;border-color:#111}
select{border:1px solid var(--line);background:#fff;padding:11px 12px;border-radius:10px}
.progressBox{display:flex;justify-content:space-between;align-items:end;border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.progressLabel{font-size:12px;color:var(--muted);letter-spacing:.08em}
.progressNum{font-size:26px;font-weight:800}
.progressTrack{height:7px;background:#e7e7e1;border-radius:999px;overflow:hidden;margin:10px 0 22px}
.progressBar{height:100%;width:0;background:#111;transition:width .2s ease}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 18px;box-shadow:0 8px 28px rgba(0,0,0,.035)}
.promptLabel{font-size:12px;color:var(--muted);margin-bottom:8px}
.meaning{font-size:clamp(27px,8vw,44px);font-weight:760;line-height:1.2;letter-spacing:-.03em;min-height:64px}
.meta{font-size:12px;color:var(--muted);margin-top:8px}
.answerRow{display:flex;gap:8px;margin-top:22px}
#answer{flex:1;border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:#fff;font-size:18px}
.feedback{min-height:58px;margin-top:14px;padding:13px 14px;border-radius:12px;display:none;line-height:1.55}
.feedback.ok{display:block;background:#eef7f1;color:var(--ok)}
.feedback.ng{display:block;background:#fbefef;color:var(--ng)}
.feedback .correct{font-size:21px;font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.actions .btn{flex:1 1 160px}
.result{display:none}
.result.show{display:block}
.score{font-size:64px;font-weight:850;letter-spacing:-.05em;margin:8px 0 2px}
.scoreSub{color:var(--muted)}
.mistakes{margin-top:24px;border-top:1px solid var(--line)}
.mistake{padding:14px 0;border-bottom:1px solid var(--line)}
.mistakeWord{font-weight:800;font-size:19px}
.mistakeMeaning{color:var(--muted);font-size:14px;margin-top:3px}
.footer{margin-top:28px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:12px;line-height:1.7}
.hide{display:none!important}
@media(max-width:560px){
  .toolbar>*{flex:1 1 calc(50% - 8px)}
  .answerRow{display:block}
  #answer{width:100%}
  .answerRow .btn{width:100%;margin-top:8px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <p class="eyebrow">EIKEN GRADE 4</p>
  <h1>Vocabulary Test</h1>
  <p class="sub">1セット10問。日本語を見て、対応する英単語を入力します。</p>
</header>

<div class="toolbar">
  <select id="priority">
    <option value="">全単語</option>
    <option value="A">優先度Aのみ</option>
    <option value="B">優先度Bのみ</option>
  </select>
  <button class="btn" id="randomBtn">ランダム10問</button>
  <button class="btn" id="restartBtn">このセットを最初から</button>
  <a class="btn" href="./eiken4_vocabulary.xlsx" download>Excel版</a>
</div>

<section id="quizArea">
  <div class="progressBox">
    <div>
      <div class="progressLabel">SET <span id="setNo">01</span></div>
      <div class="progressNum"><span id="currentNo">1</span> / <span id="totalNo">10</span></div>
    </div>
    <div class="progressLabel" id="modeLabel">固定セット</div>
  </div>
  <div class="progressTrack"><div class="progressBar" id="progressBar"></div></div>

  <div class="card">
    <div class="promptLabel">日本語 → 英語</div>
    <div class="meaning" id="meaning">---</div>
    <div class="meta" id="meta"></div>

    <div class="answerRow">
      <input id="answer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="英単語を入力">
      <button class="btn primary" id="checkBtn">答えを確認</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="actions">
      <button class="btn primary hide" id="nextBtn">次の問題</button>
    </div>
  </div>
</section>

<section class="result" id="resultArea">
  <div class="card">
    <div class="promptLabel">RESULT</div>
    <div class="score" id="score">0 / 10</div>
    <div class="scoreSub" id="scoreSub"></div>

    <div class="actions">
      <button class="btn primary" id="retryMistakesBtn">間違えた単語をもう一度</button>
      <button class="btn" id="nextSetBtn">次の10語へ</button>
      <button class="btn" id="resultRandomBtn">ランダム10問</button>
    </div>

    <div class="mistakes" id="mistakes"></div>
  </div>
</section>

<div class="footer">
  答えは大文字・小文字を区別しません。前後の空白も無視します。固定セットは元データの順に10語ずつ進みます。
</div>
</div>

"noun_note":"","other_usage":"","priority":"A","reference":""},{"word":"should","meaning":"～すべきだ","main_pos":"助動詞","pos":"助動詞","category":"助動詞","countability":"","noun_note":"","other_usage":"","priority":"A","reference":""},{"word":"will","meaning":"～するつもりだ、～だろう","main_pos":"助動詞","pos":"助動詞","category":"助動詞","countability":"","noun_note":"","other_usage":"","priority":"A","reference":""},{"word":"would","meaning":"～だろう、～していただけますか","main_pos":"助動詞","pos":"助動詞","category":"助動詞","countability":"","noun_note":"","other_usage":"","priority":"A","reference":""},{"word":"shall","meaning":"～しましょうか","main_pos":"助動詞","pos":"助動詞","category":"助動詞","countability":"","noun_note":"","other_usage":"","priority":"B","reference":""}];
const PER_SET=10;
let pool=[];
let currentSet=[];
let currentIndex=0;
let results=[];
let setIndex=0;
let mode="fixed";

const $=s=>document.querySelector(s);
const normalize=s=>String(s??"").trim().toLowerCase();

function getPool(){
  const p=$("#priority").value;
  return WORDS.filter(w=>!p || w.priority===p);
}

function makeFixedSet(index){
  pool=getPool();
  if(!pool.length) return [];
  const totalSets=Math.ceil(pool.length/PER_SET);
  setIndex=((index%totalSets)+totalSets)%totalSets;
  const start=setIndex*PER_SET;
  return pool.slice(start,start+PER_SET);
}

function makeRandomSet(){
  pool=getPool();
  const copy=[...pool];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy.slice(0,Math.min(PER_SET,copy.length));
}

function beginSet(kind="fixed", index=setIndex){
  mode=kind;
  currentSet = kind==="random" ? makeRandomSet() : makeFixedSet(index);
  currentIndex=0;
  results=[];
  $("#quizArea").classList.remove("hide");
  $("#resultArea").classList.remove("show");
  renderQuestion();
}

function renderQuestion(){
  const item=currentSet[currentIndex];
  if(!item) return finish();
  $("#setNo").textContent=String(setIndex+1).padStart(2,"0");
  $("#currentNo").textContent=currentIndex+1;
  $("#totalNo").textContent=currentSet.length;
  $("#modeLabel").textContent=mode==="random"?"ランダム":mode==="review"?"間違い復習":"固定セット";
  $("#progressBar").style.width=`${(currentIndex/currentSet.length)*100}%`;
  $("#meaning").textContent=item.meaning || "—";
  $("#meta").textContent=[item.main_pos,item.category,item.countability].filter(Boolean).join(" · ");
  $("#answer").value="";
  $("#answer").disabled=false;
  $("#checkBtn").disabled=false;
  $("#feedback").className="feedback";
  $("#feedback").innerHTML="";
  $("#nextBtn").classList.add("hide");
  setTimeout(()=>$("#answer").focus(),50);
}

function checkAnswer(){
  const item=currentSet[currentIndex];
  const user=normalize($("#answer").value);
  if(!user) return;
  const correct=normalize(item.word);
  const ok=user===correct;
  results.push({...item,userAnswer:$("#answer").value.trim(),ok});
  $("#answer").disabled=true;
  $("#checkBtn").disabled=true;

  if(ok){
    $("#feedback").className="feedback ok";
    $("#feedback").innerHTML=`○ 正解<br><span class="correct">${item.word}</span>`;
  }else{
    $("#feedback").className="feedback ng";
    $("#feedback").innerHTML=`× 不正解<br>正解：<span class="correct">${item.word}</span>`;
  }
  $("#nextBtn").classList.remove("hide");
  $("#nextBtn").textContent=currentIndex===currentSet.length-1?"結果を見る":"次の問題";
}

function nextQuestion(){
  currentIndex++;
  if(currentIndex>=currentSet.length) finish();
  else renderQuestion();
}

function finish(){
  $("#quizArea").classList.add("hide");
  $("#resultArea").classList.add("show");
  const correct=results.filter(r=>r.ok).length;
  $("#score").textContent=`${correct} / ${currentSet.length}`;
  $("#scoreSub").textContent=correct===currentSet.length?"全問正解！":`${currentSet.length-correct}語を復習しましょう。`;
  const mistakes=results.filter(r=>!r.ok);
  $("#retryMistakesBtn").disabled=mistakes.length===0;
  $("#mistakes").innerHTML=mistakes.length
    ? `<div class="promptLabel" style="margin-top:18px">間違えた単語</div>`+
      mistakes.map(x=>`<div class="mistake"><div class="mistakeWord">${x.word}</div><div class="mistakeMeaning">${x.meaning} ／ あなたの答え：${x.userAnswer||"（未入力）"}</div></div>`).join("")
    : "";
  $("#progressBar").style.width="100%";
}

$("#checkBtn").addEventListener("click",checkAnswer);
$("#nextBtn").addEventListener("click",nextQuestion);
$("#answer").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    if(!$("#checkBtn").disabled) checkAnswer();
    else nextQuestion();
  }
});
$("#randomBtn").addEventListener("click",()=>beginSet("random"));
$("#resultRandomBtn").addEventListener("click",()=>beginSet("random"));
$("#restartBtn").addEventListener("click",()=>beginSet(mode,setIndex));
$("#priority").addEventListener("change",()=>{setIndex=0;beginSet("fixed",0);});
$("#nextSetBtn").addEventListener("click",()=>beginSet("fixed",setIndex+1));
$("#retryMistakesBtn").addEventListener("click",()=>{
  const mistakes=results.filter(r=>!r.ok);
  if(!mistakes.length)return;
  currentSet=mistakes;
  currentIndex=0;
  results=[];
  mode="review";
  $("#quizArea").classList.remove("hide");
  $("#resultArea").classList.remove("show");
  renderQuestion();
});

beginSet("fixed",0);
</script>

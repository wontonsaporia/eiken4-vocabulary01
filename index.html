<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="color-scheme" content="light">
  <meta name="description" content="英検4級語彙を10問からENDLESSまで柔軟に学べる、進捗保存対応の学習Webアプリ。">
  <title>EIKEN 4 Vocabulary Lab</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="brand" data-route="home" aria-label="ホームへ">
        <span class="brand-mark">4</span>
        <span>
          <strong>VOCAB LAB</strong>
          <small>EIKEN GRADE 4</small>
        </span>
      </button>
      <div class="top-actions">
        <span id="offlineBadge" class="status-pill" hidden>OFFLINE</span>
        <button class="icon-btn" id="installBtn" hidden aria-label="アプリをインストール">＋</button>
      </div>
    </header>

    <main id="main" class="main"></main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button data-route="home" class="nav-item active">
        <span class="nav-icon">⌂</span><span>ホーム</span>
      </button>
      <button data-route="tests" class="nav-item">
        <span class="nav-icon">✓</span><span>テスト</span>
      </button>
      <button data-route="review" class="nav-item">
        <span class="nav-icon">↻</span><span>復習</span>
      </button>
      <button data-route="list" class="nav-item">
        <span class="nav-icon">≡</span><span>単語</span>
      </button>
      <button data-route="progress" class="nav-item">
        <span class="nav-icon">▥</span><span>進捗</span>
      </button>
    </nav>
  </div>

  <script src="./data/data.js"></script>
  <script src="./app.js"></script>
</body>
</html>

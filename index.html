<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英検4級 Vocabulary</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--text:#111;--muted:#6d6d68;--line:#deded8;--accent:#e52421}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
header{max-width:1120px;margin:0 auto;padding:36px 18px 22px}
.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--accent);font-weight:700;margin:0 0 8px}
h1{font-size:clamp(40px,13vw,78px);line-height:.95;margin:0;font-weight:800;letter-spacing:-.05em}
.lead{color:var(--muted);margin:16px 0 22px;line-height:1.7}
.download{display:inline-block;background:#111;color:#fff;text-decoration:none;padding:13px 16px;border-radius:10px;font-weight:650}
main{max-width:1120px;margin:0 auto;padding:0 18px 60px}
.controls{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;padding:16px 0;border-top:1px solid var(--line)}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.summary{display:flex;gap:20px;padding:6px 0 18px;flex-wrap:wrap}
.summary b{font-size:24px;margin-right:6px}
.summary span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:8px;margin:4px 0 16px}
.tab{border:0;border-radius:999px;padding:9px 14px;background:#e9e9e4}
.tab.active{background:#111;color:#fff}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;min-height:140px}
.word{font-size:25px;font-weight:750;word-break:break-word}
.meaning{font-size:15px;margin-top:6px}
.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.55}
.legend{margin-top:32px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:13px;line-height:1.7}
.empty{grid-column:1/-1;color:var(--muted);padding:28px 0}
@media(max-width:760px){
  .controls{grid-template-columns:1fr 1fr}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
  .controls{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <p class="eyebrow">EIKEN GRADE 4</p>
  <h1>Vocabulary</h1>
  <p class="lead">英検4級の単語・熟語を検索できます。授業や自宅学習用にExcel版も保存できます。</p>
  <a class="download" href="./eiken4_vocabulary.xlsx" download>Excel版をダウンロード</a>
</header>
<main>
  <section class="controls">
    <input id="search" type="search" placeholder="英単語・日本語で検索">
    <select id="pos"><option value="">すべての品詞</option></select>
    <select id="priority">
      <option value="">優先度すべて</option>
      <option value="A">優先度 A</option>
      <option value="B">優先度 B</option>
    </select>
    <select id="countability">
      <option value="">名詞区分すべて</option>
      <option value="C">C 可算名詞</option>
      <option value="U">U 不可算名詞</option>
      <option value="C/U">C/U 両用</option>
      <option value="PN">PN 固有名詞</option>
      <option value="PL">PL 複数形</option>
      <option value="PL-only">PL-only</option>
    </select>
  </section>

  <section class="summary">
    <div><b id="wordCount">0</b><span>表示中の単語</span></div>
    <div><b id="phraseCount">0</b><span>熟語・表現</span></div>
  </section>

  <nav class="tabs">
    <button class="tab active" data-tab="words">単語</button>
    <button class="tab" data-tab="phrases">熟語・表現</button>
  </nav>

  <section id="wordsPanel"><div id="words" class="cards"></div></section>
  <section id="phrasesPanel" hidden><div id="phrases" class="cards"></div></section>

  <section class="legend">
    <b>名詞区分：</b> C = 可算名詞 / U = 不可算名詞 / C/U = 両用 / PN = 固有名詞 / PL = 複数形。<br>
    より詳しい語法・参照情報はExcel版を確認してください。
  </section>
</main>
